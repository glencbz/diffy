[project]
name = "diffy"
version = "0.1.0"
description = "Virtual env for running entangled and building docs."
authors = ["glen <glencbz@gmail.com>"]
# You may still want to add a license here
# license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.13"

[dependency-groups]
dev = [
    "entangled-cli>=2.4.3",
    "mkdocs>=1.6",
    "mkdocs-entangled-plugin",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10",
]

[tool.uv.sources]
# Vendored + patched: no released mkdocs-entangled-plugin works with
# entangled-cli 2.4.2+. See vendor/mkdocs-entangled-plugin/README.md.
mkdocs-entangled-plugin = { path = "vendor/mkdocs-entangled-plugin", editable = true }
